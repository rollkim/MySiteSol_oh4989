# oh4989.com Nginx 설정 — 서버 `/etc/nginx/sites-available/oh4989` 의 저장소 보관본
#
# 이 파일은 원본이다. 서버 설정을 고칠 일이 생기면 여기서 고쳐 scp로 올린다
# (서버에서 직접 편집하면 다음 배포 때 무엇이 바뀌었는지 알 수 없다).
#
# 전제:
#   - 인증서가 이미 발급돼 있어야 한다. 없으면 `nginx -t`가 실패한다.
#     최초 1회: nginx-oh4989-acme.conf 로 80포트만 띄우고 certbot certonly 실행 → 그다음 이 파일
#   - Nginx는 www-data로 돌므로 /home/oh4989 와 그 하위를 통과할 수 있어야 한다
#     (usermod -aG oh4989 www-data + /home/oh4989, shared 를 750으로)
#   - nginx 1.24 문법: `listen 443 ssl http2;` (1.25+ 는 `http2 on;` 로 분리됐다)

# ── HTTP: 갱신 챌린지만 처리하고 나머지는 전부 HTTPS로 ──
server {
    listen 80;
    listen [::]:80;
    server_name oh4989.com www.oh4989.com;

    # 리다이렉트보다 먼저 매칭되어야 인증서 갱신이 된다 (^~ 가 그 역할)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://oh4989.com$request_uri;
    }
}

# ── HTTPS www → non-www (SPEC §7) ──
# canonical·OG·sitemap이 전부 non-www 기준이라 www로 들어온 요청을 한 번에 넘긴다
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.oh4989.com;

    ssl_certificate     /etc/letsencrypt/live/oh4989.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oh4989.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://oh4989.com$request_uri;
}

# ── HTTPS 본체 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oh4989.com;

    ssl_certificate     /etc/letsencrypt/live/oh4989.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oh4989.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 매물 사진 여러 장 업로드 대비. 브라우저 Canvas에서 이미 축소해 올린다
    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 사이트가 안정된 뒤 아래를 켠다.
    # 켜는 순간 브라우저가 max-age 동안 이 도메인의 HTTP 접속을 거부하므로,
    # 인증서 문제가 생겼을 때 되돌리기가 어려워진다. 운영 확인 후 활성화할 것.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 갱신 챌린지 (HTTP에서 이미 처리하지만, HSTS를 켠 뒤에도 갱신되도록 여기에도 둔다)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 빌드 산출물은 파일명에 해시가 붙어 내용이 바뀌면 이름이 바뀐다 → 영구 캐시 가능.
    # current는 심볼릭 링크라 배포 슬롯이 바뀌어도 이 경로 그대로다
    location /_next/static/ {
        alias /home/oh4989/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 매물 사진 — 릴리스 폴더 밖 고정 경로라 재배포에도 남는다
    location /uploads/ {
        alias /home/oh4989/shared/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 문의 레이트리밋(IP당 시간당 5회, SPEC §4)이 이 헤더로 실제 방문자 IP를 읽는다.
        # 이게 없으면 모든 요청이 127.0.0.1로 보여 한 사람이 전체 한도를 소진시킨다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
